# 사용법: docker compose run --rm dev
# 이 폴더가 컨테이너 /work로 연결됨. 내 PC에서 고친 코드를 컨테이너에서 바로 빌드
services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: embedded-os-examples:26.04
    volumes:
      - .:/work
    working_dir: /work
    # 14장 실시간 우선순위(SCHED_FIFO)용. 일반 사용자도 우선순위 99까지 쓸 수 있게
    ulimits:
      rtprio: 99
    cap_add:
      - SYS_NICE
    stdin_open: true
    tty: true
